[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
default-members = ["crates/harness-contracts", "crates/harness-storage", "crates/harness-platform", "crates/harness-runtime", "crates/harness-extensions", "crates/harness-browser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
harness-contracts = { path = "crates/harness-contracts" }
harness-storage = { path = "crates/harness-storage" }
harness-platform = { path = "crates/harness-platform" }
harness-runtime = { path = "crates/harness-runtime" }
harness-extensions = { path = "crates/harness-extensions" }
harness-orchestration = { path = "crates/harness-orchestration" }
harness-browser = { path = "crates/harness-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
toml = "0.9"
semver = "1"
ignore = "0.4"
dunce = "1"
dirs = "6"
clap = { version = "4", features = ["derive"] }
similar = "2"
bytes = "1"
agent-client-protocol = { version = "=5.0.0", features = ["stdio"] }
tokio-tungstenite = "0.27"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = "debuginfo"
