name: Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      offline:
        description: Build the larger offline WebView2 installer
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace --exclude rust-harness-desktop
      - name: Build standard NSIS
        if: ${{ !inputs.offline }}
        run: npm run desktop:build
      - name: Build offline NSIS
        if: ${{ inputs.offline }}
        run: npm run desktop:offline
      - name: Desktop smoke
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rust-harness-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
