name: Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      offline:
        description: Build the larger offline WebView2 installer
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run sdk:check
      - run: cargo test --workspace --exclude rust-harness-desktop
      - run: python -m unittest discover -s sdk/python -p 'test_*.py' -v
      - name: Build standard NSIS
        if: ${{ !inputs.offline }}
        run: npm run desktop:build
      - name: Build offline NSIS
        if: ${{ inputs.offline }}
        run: npm run desktop:offline
      - name: Desktop smoke
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Verify installer UAC manifest
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installer = Join-Path target/release/bundle/nsis ('{0}_{1}_x64-setup.exe' -f $config.productName, $config.version)
          python scripts/verify-installer.py $installer --application target/release/rust-harness-desktop.exe
          if ($LASTEXITCODE) { throw 'Installer UAC manifest verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: rust-harness-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
