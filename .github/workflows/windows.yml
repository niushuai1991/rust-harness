name: Windows desktop
on:
  # 自动构建暂时关闭,恢复时取消以下两行注释
  # push:
  # pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run sdk:check
      - run: cargo test --workspace --exclude rust-harness-desktop
      - run: python -m unittest discover -s sdk/python -p 'test_*.py' -v
      - name: Build NSIS
        run: npm run desktop:build
      - name: Verify installer UAC manifest
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installer = Join-Path target/release/bundle/nsis ('{0}_{1}_x64-setup.exe' -f $config.productName, $config.version)
          python scripts/verify-installer.py $installer --application target/release/rust-harness-desktop.exe
          if ($LASTEXITCODE) { throw 'Installer UAC manifest verification failed' }
      - name: Verify packaged ConPTY assets
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installer = Join-Path target/release/bundle/nsis ('{0}_{1}_x64-setup.exe' -f $config.productName, $config.version)
          $contents = & 7z l -slt $installer
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installer contents.' }
          foreach ($file in @('conpty.dll', 'OpenConsole.exe')) {
            if (-not ($contents | Where-Object { $_ -match ('^Path = binaries[\\/]conpty[\\/]' + [regex]::Escape($file) + '$') })) {
              throw "Installer is missing ConPTY asset: $file"
            }
          }
      - name: Desktop smoke
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rust-harness-windows-nsis
          path: target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
