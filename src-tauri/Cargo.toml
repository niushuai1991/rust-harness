[package]
name = "rust-harness-desktop"
version = "0.1.6"
edition = "2024"

[lib]
name = "rust_harness_desktop"
crate-type = ["rlib"]

[features]
signed-updates = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harness-contracts = { path = "../crates/harness-contracts" }
harness-runtime.workspace = true
harness-platform.workspace = true
harness-extensions.workspace = true
harness-orchestration.workspace = true
harness-browser.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
dirs.workspace = true
tracing-subscriber.workspace = true
specta-typescript = "0.0.12"

# 版本与 Cargo.lock 中 wry 所用一致，避免引入重复编译单元
[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = "0.62"
tracing.workspace = true
