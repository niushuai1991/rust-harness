[package]
name = "harness-extensions"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
harness-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
semver.workspace = true
uuid.workspace = true
tracing.workspace = true
anyhow.workspace = true
reqwest.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmtime = { version = "49.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation", "wat"] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }
rmcp = { version = "3.8.0", features = ["client", "transport-io", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
tempfile.workspace = true
wat = "1"

