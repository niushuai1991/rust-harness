[package]
name = "harness-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "内置浏览器能力：系统 Edge/Chrome headless + 轻量 CDP 客户端，向 Runtime 注册 browser_* 工具组"

[dependencies]
harness-contracts = { workspace = true }
harness-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
